<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<title>סקר לקוחות שקד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: Shaked bakery brand — black ground, gold wheat crest, one narrow column of numbered cards in two sections; owner results below */
:root{
  color-scheme:light;
  --bg:#F5EFE3; --surface:#FFFFFF; --raise:#F8F5EF; --sheet:#FFFFFF; --ink:#2B231A; --muted:#7A6D5B; --line:#E7DDCB;
  --gold:#B58A30; --gold-hi:#D9B566; --gold-lo:#8A6620; --gold-soft:#FBF3E0; --danger:#B3261E;
  --heading:#3A2A16;
  --leaf:var(--gold); --citrus:var(--gold-hi);
  --display:"Frank Ruhl Libre","David",Georgia,serif;
  --body:"Assistant","Arial Hebrew",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(ellipse 900px 420px at 50% -120px,rgba(217,181,102,.18),transparent 70%);
  background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px;background:var(--sheet);border-radius:22px;padding:28px 28px 36px;box-shadow:0 12px 40px rgba(90,65,20,.12),0 1px 3px rgba(90,65,20,.06)}
@media (max-width:520px){.wrap{padding:18px 14px 28px;border-radius:18px}}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-bottom:10px}
.bsd{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:16px;color:var(--gold-lo)}
.logo{width:100%;max-width:520px;height:auto;border-radius:16px;box-shadow:0 10px 30px rgba(60,40,10,.18)}
.brand{font-family:var(--display);font-weight:900;font-size:clamp(52px,12vw,76px);line-height:1;margin:0;
  background:linear-gradient(180deg,var(--gold) 10%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-family:var(--display);font-weight:500;font-size:20px;color:var(--gold-lo);margin:0}
.rule{display:flex;align-items:center;gap:12px;width:100%;max-width:420px;color:var(--muted);font-size:13px;letter-spacing:.18em;margin-top:6px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5.6vw,34px);line-height:1.25;margin:18px 0 0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(180deg,#C99A3A,#8A6620);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro{display:flex;flex-direction:column;gap:8px;max-width:46ch;margin:6px auto 0;color:var(--ink);font-size:17px;line-height:1.7}
.intro p{margin:0;text-wrap:pretty}
.intro .greet{font-family:var(--display);font-weight:700;font-size:19px;color:var(--heading)}
.intro .thanks{font-family:var(--display);font-weight:700;font-size:19px;color:var(--gold-lo)}
.lead{margin:0;color:var(--muted);max-width:52ch}
.meta{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--gold-lo);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px;margin-top:4px}
.section{font-family:var(--display);font-weight:700;font-size:24px;margin:22px 0 4px;color:var(--heading);display:flex;align-items:center;gap:12px}
.section::before{content:"";width:6px;height:28px;border-radius:3px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));flex:none}
.section::after{content:"";flex:1;height:1px;background:linear-gradient(270deg,transparent,var(--gold-lo))}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(80,60,20,.05);display:flex;flex-direction:column;gap:12px}
.q-head{display:flex;gap:12px;align-items:baseline}
.num{font-family:var(--display);font-weight:700;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:1.4em}
.q h2{font-family:var(--body);font-weight:700;font-size:18px;margin:0;line-height:1.4;text-wrap:balance}
.req{color:var(--danger)}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 0;padding-inline-start:calc(1.4em + 12px)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--raise);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,color .15s;user-select:none}
.chip span:hover{border-color:var(--gold-lo)}
.chip input:checked+span{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold);color:#1A1308;font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--gold-hi);outline-offset:2px}
.chip input:disabled+span{cursor:default;opacity:.75}
.scale{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.scale .lbl{min-width:0}
.dots{display:flex;gap:6px;direction:ltr}
.dots .chip span{width:38px;height:38px;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:96px;resize:vertical}
textarea::placeholder,input::placeholder{color:#A99C86}
textarea:focus,input[type=text]:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.submit-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin-top:8px}
button{font:inherit;font-family:var(--display);font-size:20px;font-weight:700;border:0;border-radius:999px;padding:12px 44px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));color:#1A1308;cursor:pointer;box-shadow:0 6px 20px rgba(181,138,48,.25)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.status{font-size:15px;color:var(--muted);text-align:center;width:100%}
.status.ok{color:var(--gold-lo);font-weight:700}
.status.err{color:var(--danger)}
.notice{background:var(--gold-soft);border:1px solid var(--gold-lo);border-radius:12px;padding:14px 16px;font-size:15px}
footer{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.06em;margin-top:12px}
.results{border-top:1px solid var(--gold-lo);padding-top:24px;display:flex;flex-direction:column;gap:20px}
.results h2{font-family:var(--display);font-size:26px;margin:0;color:var(--heading)}
.total{color:var(--muted);margin:-12px 0 0}
.rsection{font-family:var(--display);font-size:20px;margin:8px 0 0;color:var(--gold)}
.rblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.rblock h3{font-weight:700;font-size:16px;margin:0}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:15px}
.bar .track{height:10px;background:var(--raise);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--gold);border-radius:5px}
.bar .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:left}
.texts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.texts li{background:var(--raise);border-radius:8px;padding:8px 12px;font-size:15px}
.empty{color:var(--muted);font-size:15px}
@media (max-width:480px){.scale{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:minmax(0,7em) minmax(0,1fr) 2.8em}.q{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <h1>איך אנחנו, ומה <em>עוד</em> תרצו לקבל?</h1>
    <div class="intro">
      <p class="greet">לקוחות יקרים,</p>
      <p>אנחנו בשקד רוצים להשתפר בשבילכם: לשפר את השירות, להרחיב את המגוון ולהתאים את עצמנו בדיוק לצרכים שלכם.</p>
      <p>מילוי הסקר אורך כ־2 דקות בלבד.<br>נשמח אם תקדישו לו כמה רגעים בתשומת לב, ותעזרו לנו לעזור לכם.</p>

  {id:"value", type:"text-long", title:"איך הייתם מגדירים את הערך שאנחנו נותנים לכם?", placeholder:"במשפט או שניים, במילים שלכם"},
  {id:"improve", type:"text-short", title:"דבר אחד שהיינו יכולים לעשות טוב יותר?", placeholder:"לא חובה"},
  {type:"section", title:"ומה עוד תרצו לקבל מאיתנו?"},
  {id:"cats", type:"multi", title:"באילו תחומים הייתם רוצים שנרחיב את המבחר?", hint:"אפשר לבחור כמה",
   options:["שתייה","חד פעמי","חומרי גלם","חומרי ניקיון","קופסאות שומרים","קפואים"]},
  {id:"top", type:"text-short", title:"מוצר שהייתם רוצים שנוסיף?", placeholder:"לדוגמה: מגשי אלומיניום עם מכסה"},
  {id:"notes", type:"text-long", title:"עוד משהו שתרצו להגיד לנו?", placeholder:"לא חובה"}
];

const form = document.getElementById("survey");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function buildForm(){
  let html = "";
  let n=0;
  QUESTIONS.forEach(q=>{
    if(q.type==="section"){ html += `<h2 class="section">${esc(q.title)}</h2>`; return; }
    const i=n++;
    html += `<fieldset class="q" style="margin:0 0 16px"><div class="q-head"><span class="num">${i+1}</span><h2>${esc(q.title)}${q.required?' <span class="req" aria-label="חובה">*</span>':''}</h2></div>`;
    if(q.hint) html += `<p class="hint">${esc(q.hint)}</p>`;
    if(q.type==="multi"||q.type==="single"){
      const t = q.type==="multi"?"checkbox":"radio";
      html += `<div class="opts">` + q.options.map((o,j)=>`<label class="chip"><input type="${t}" id="${q.id}-${j}" name="${q.id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("") + `</div>`;
      if(q.other) html += `<input type="text" class="other" id="${q.id}_other" name="${q.id}_other" maxlength="200" placeholder="פרטו, במה?" hidden>`;
    } else if(q.type==="scale"){
      html += `<div class="scale">` + q.items.map((it,k)=>`<div class="lbl">${esc(it)}</div><div class="dots" role="radiogroup" aria-label="${esc(it)}">` +
        [1,2,3,4,5].map(v=>`<label class="chip"><input type="radio" id="${q.id}-${k}-${v}" name="${q.id}-${k}" value="${v}"><span>${v}</span></label>`).join("") + `</div>`).join("") + `</div>`;
    } else if(q.type==="text-short"){
      html += `<input type="text" id="${q.id}" name="${q.id}" maxlength="200"${q.required?' required aria-required="true"':''} placeholder="${esc(q.placeholder||"")}">`;
    } else {
      html += `<textarea id="${q.id}" name="${q.id}" maxlength="1500" placeholder="${esc(q.placeholder||"")}"></textarea>`;
    }
    html += `</fieldset>`;
  });
  html += `<div class="submit-row"><button type="submit" id="send">שליחה</button><span class="status" id="status"></span></div>`;
  form.innerHTML = html;
}

function collect(){
  const out = {};
  QUESTIONS.forEach(q=>{
    if(q.type==="section") return;
    if(q.type==="multi") out[q.id] = [...form.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value);
    else if(q.type==="single"){ const c=form.querySelector(`input[name="${q.id}"]:checked`); out[q.id]=c?c.value:""; if(q.other) out[q.id+"_other"]=out[q.id]===q.other?(form.elements[q.id+"_other"].value||"").trim().slice(0,200):""; }
    else if(q.type==="scale"){ out[q.id]={}; q.items.forEach((it,k)=>{const c=form.querySelector(`input[name="${q.id}-${k}"]:checked`); if(c) out[q.id][it]=Number(c.value);}); }
    else out[q.id] = (form.elements[q.id].value||"").trim().slice(0,1500);
  });
  return out;
}

function fill(d){
  QUESTIONS.forEach(q=>{
    if(q.type==="section") return;
    const v = d[q.id];
    if(v==null) return;
    if(q.type==="multi") form.querySelectorAll(`input[name="${q.id}"]`).forEach(i=>i.checked=Array.isArray(v)&&v.includes(i.value));
    else if(q.type==="single") form.querySelectorAll(`input[name="${q.id}"]`).forEach(i=>i.checked=i.value===v); if(q.other&&typeof d[q.id+"_other"]==="string"){ form.elements[q.id+"_other"].value=d[q.id+"_other"]; syncOther(q); }
    else if(q.type==="scale") q.items.forEach((it,k)=>form.querySelectorAll(`input[name="${q.id}-${k}"]`).forEach(i=>i.checked=Number(i.value)===v[it]));
    else form.elements[q.id].value = typeof v==="string"?v:"";
  });
}

function setStatus(msg, cls){ const s=document.getElementById("status"); s.textContent=msg; s.className="status"+(cls?" "+cls:""); }
function showNotice(msg){ const n=document.getElementById("notice"); n.textContent=msg; n.hidden=false; }

/* ---------- results (owner / editors only) ---------- */
function renderResults(docs){
  const sec=document.getElementById("results"); sec.hidden=false;
  const rows = docs.map(d=>d.data()||{});
  document.getElementById("total").textContent = rows.length ? `${rows.length} משיבים עד עכשיו` : "עדיין אין תשובות. שתפו את הקישור עם הלקוחות.";
  const body=document.getElementById("rbody"); body.innerHTML="";
  if(!rows.length) return;
  QUESTIONS.forEach(q=>{
    if(q.type==="section"){ const h=document.createElement("h3"); h.className="rsection"; h.textContent=q.title; body.appendChild(h); return; }
    const b=document.createElement("div"); b.className="rblock";
    let h=`<h3>${esc(q.title)}</h3>`;
    if(q.type==="multi"||q.type==="single"){
      const counts=q.options.map(o=>[o,rows.filter(r=>q.type==="multi"?(Array.isArray(r[q.id])&&r[q.id].includes(o)):r[q.id]===o).length]).sort((a,b)=>b[1]-a[1]);
      const max=Math.max(1,...counts.map(c=>c[1]));
      h+=counts.map(([o,n])=>`<div class="bar"><span>${esc(o)}</span><div class="track"><div class="fill" style="width:${(n/max*100).toFixed(1)}%"></div></div><span class="n">${n}</span></div>`).join("");
      if(q.other){ const os=rows.map(r=>typeof r[q.id+"_other"]==="string"?r[q.id+"_other"]:"").filter(Boolean);
        if(os.length){ b.innerHTML=h+`<ul class="texts"></ul>`; const ul=b.querySelector("ul"); os.forEach(t=>{const li=document.createElement("li"); li.textContent="אחר: "+t; ul.appendChild(li);}); body.appendChild(b); return; } }
    } else if(q.type==="scale"){
      const avgs=q.items.map(it=>{const vs=rows.map(r=>r[q.id]&&r[q.id][it]).filter(v=>typeof v==="number"); return [it, vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:0];}).sort((a,b)=>b[1]-a[1]);
      h+=avgs.map(([it,a])=>`<div class="bar"><span>${esc(it)}</span><div class="track"><div class="fill" style="width:${(a/5*100).toFixed(1)}%;background:var(--citrus)"></div></div><span class="n">${a?a.toFixed(1):"–"}</span></div>`).join("");
    } else {
      const ts=rows.map(r=>typeof r[q.id]==="string"?r[q.id]:"").filter(Boolean);
      h+= ts.length?`<ul class="texts"></ul>`:`<p class="empty">אין תשובות עדיין</p>`;
      b.innerHTML=h; const ul=b.querySelector("ul");
      if(ul) ts.forEach(t=>{const li=document.createElement("li"); li.textContent=t; ul.appendChild(li);});
      body.appendChild(b); return;
    }
    b.innerHTML=h; body.appendChild(b);
  });
}

function syncOther(q){ const c=form.querySelector(`input[name="${q.id}"]:checked`); const box=form.elements[q.id+"_other"]; box.hidden=!(c&&c.value===q.other); }
/* ---------- boot ---------- */
buildForm();
QUESTIONS.filter(q=>q.other).forEach(q=>{
  form.querySelectorAll(`input[name="${q.id}"]`).forEach(i=>i.addEventListener("change",()=>{ syncOther(q); if(i.checked&&i.value===q.other) form.elements[q.id+"_other"].focus(); }));
});
/* כתובת ה־Web App של Google Apps Script (מתעדכנת אחרי הפריסה) */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwkzrNhQvWN83E-Q5pi4hhMlacYyv_wS8NHQErpnU8K6QzEnO4cCDA56NSpgxUrTaJnw/exec";
const DONE_KEY = "shaked-survey-done";
let locked=false;
function lockForm(msg){
  locked=true;
  form.querySelectorAll("input,textarea,button").forEach(el=>el.disabled=true);
  setStatus(msg,"ok");
}
form.addEventListener("submit", async e=>{
  e.preventDefault();
  if(locked) return;
  const data=collect();
  if(!data.name){ setStatus("כתבו את שם העסק לפני השליחה.","err"); form.elements.name.focus(); return; }
  if(!SCRIPT_URL || SCRIPT_URL.indexOf("script.google.com")<0){ setStatus("הסקר עדיין לא מחובר לגיליון התשובות.","err"); return; }
  const bizType = data.biz==="אחר" ? (data.biz_other||"אחר") : data.biz;
  const payload = {...data, name: bizType ? `${data.name} (${bizType})` : data.name};
  const btn=document.getElementById("send"); btn.disabled=true; setStatus("שולח…");
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    try{ localStorage.setItem(DONE_KEY,"1"); }catch(_){}
    lockForm("תודה רבה! התשובות נשמרו.");
  }catch(err){
    setStatus("השליחה לא הצליחה. בדקו את החיבור לאינטרנט ונסו שוב.","err");
    btn.disabled=false;
  }
});
try{ if(localStorage.getItem(DONE_KEY)) lockForm("כבר מילאתם את הסקר. תודה רבה!"); }catch(_){}
</script>
